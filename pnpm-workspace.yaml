packages:
  - "apps/*"
  - "packages/*"

# Native postinstall builds we trust (pnpm blocks build scripts by default).
allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true

# GHSA-67mh-4wv8-2f99: esbuild's dev server accepts cross-origin requests. We
# never run `esbuild serve`; the vulnerable 0.18 only reaches us through the
# deprecated @esbuild-kit chain inside drizzle-kit (superseded by tsx, which
# drizzle-kit already depends on). Scoped to that path so every other esbuild
# consumer keeps resolving on its own.
overrides:
  "@esbuild-kit/core-utils>esbuild": "^0.25.12"
