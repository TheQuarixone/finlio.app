# Git hooks, managed by Lefthook.
# Installed automatically on `pnpm install` (see the root "prepare" script);
# run `pnpm exec lefthook install` to (re)install manually.

pre-commit:
  commands:
    lint:
      # Only run when app source is staged. Turbo caches, so repeat commits are
      # fast; it uses the web app's own ESLint config.
      glob: "apps/web/src/**/*.{js,jsx,ts,tsx}"
      run: pnpm turbo run lint

commit-msg:
  commands:
    commitlint:
      # Enforce Conventional Commits (feat:, fix:, chore: …). See CLAUDE.md.
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    lint:
      run: pnpm turbo run lint
