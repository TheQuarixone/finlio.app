version: 2
updates:
  # npm dependencies — grouped so we get a few tidy PRs a week, not dozens.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # Framework majors we want to review deliberately, on their own.
      next-react:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
      # Everything else: bundle minor/patch to keep noise down.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions versions current too.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
