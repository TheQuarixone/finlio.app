name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo runs lint + build across the workspace (packages without those
      # tasks are skipped). Typecheck happens inside `next build`. `test` will
      # join here once Vitest lands (Phase 1).
      - name: Lint · Build
        run: pnpm turbo run lint build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # next build evaluates modules that construct the Resend client at
          # import time; a dummy key lets the build succeed. Real key is a
          # Vercel deploy secret, used only at request time.
          RESEND_API_KEY: "re_ci_dummy_build_key"

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Enforce Conventional Commits on every commit in the PR (same ruleset as
      # the local commit-msg hook, commitlint.config.mjs).
      - name: Lint PR commit messages
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
