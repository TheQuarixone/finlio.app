name: CI

on:
  pull_request:
  push:
    branches: [production]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `--if-present` keeps CI green before every script exists (Phase 1 adds
      # typecheck/test). Drop the flags once the scripts are in package.json — see
      # docs/phase-1.md task CI-2.
      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build
        env:
          # Builds must not require real secrets. Provide dummy values so any
          # module that reads env at build time doesn't throw in CI.
          NEXT_TELEMETRY_DISABLED: "1"
