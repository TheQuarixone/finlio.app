name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turbo runs these across the workspace; packages without a given task are
      # skipped. Cheap checks first so failures surface fast.
      - name: Lint · Typecheck · Test · Build
        run: pnpm turbo run lint typecheck test build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # next build evaluates modules that construct the Resend client at
          # import time; a dummy key lets the build succeed. Real key is a
          # Vercel deploy secret, used only at request time.
          RESEND_API_KEY: "re_ci_dummy_build_key"

      # Reported after the gate above, so a coverage hiccup never decides a
      # merge on its own. Needs no secrets — every test mocks its I/O.
      - name: Coverage
        run: pnpm --filter web test:coverage

      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Enforce Conventional Commits on every commit in the PR (same ruleset as
      # the local commit-msg hook, commitlint.config.mjs).
      - name: Lint PR commit messages
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  deploy:
    name: Deploy (Vercel)
    # Only after lint/typecheck/test/build pass — this is the whole point:
    # nothing reaches Vercel that CI hasn't already vetted.
    needs: verify
    # No-ops until the three Vercel secrets exist, so adding this doesn't break
    # anyone's CI in the meantime.
    if: needs.verify.result == 'success' && vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # `production` on main, `preview` for pull requests — same split Vercel's
      # own Git integration used, just gated behind the tests now.
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "env=preview" >> "$GITHUB_OUTPUT"
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel environment
        run: npx vercel@latest pull --yes --environment=${{ steps.target.outputs.env }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx vercel@latest build ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(npx vercel@latest deploy --prebuilt ${{ steps.target.outputs.flag }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
